services:
  postgres:
    image: postgres:16
    container_name: customer-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: customer_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
